name: Go SDK CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go mod tidy
      - run: test -z "$(git status --porcelain)"
      - run: gofmt -d . | (! grep .)
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
